<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#0b0906"/>
      <stop offset="1" stop-color="#151007"/>
    </linearGradient>
    <radialGradient id="spot" cx="72%" cy="30%" r="58%">
      <stop offset="0" stop-color="#d8ad58" stop-opacity=".34"/>
      <stop offset=".30" stop-color="#a7772d" stop-opacity=".16"/>
      <stop offset=".68" stop-color="#3a2912" stop-opacity=".07"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070a08"/>
      <stop offset=".28" stop-color="#172218"/>
      <stop offset=".46" stop-color="#31412c"/>
      <stop offset=".60" stop-color="#111913"/>
      <stop offset="1" stop-color="#050605"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#d6aa54" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dc9e"/>
      <stop offset=".32" stop-color="#c89a44"/>
      <stop offset=".68" stop-color="#8b6428"/>
      <stop offset="1" stop-color="#e7c675"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .055"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <ellipse cx="1190" cy="245" rx="360" ry="245" fill="#d2a451" opacity=".07" filter="url(#blur)"/>

  <!-- soft cellar-like arches -->
  <path d="M835 770V290c0-176 145-270 300-270s300 94 300 270v480" fill="none" stroke="#bc914a" stroke-opacity=".09" stroke-width="2"/>
  <path d="M910 770V330c0-130 105-205 225-205s225 75 225 205v440" fill="none" stroke="#f0cf84" stroke-opacity=".065" stroke-width="1.5"/>
  <path d="M980 770V372c0-90 72-146 155-146s155 56 155 146v398" fill="none" stroke="#f0cf84" stroke-opacity=".055"/>

  <!-- bokeh -->
  <g fill="#d2a451">
    <circle cx="1290" cy="150" r="5" opacity=".55"/>
    <circle cx="1378" cy="226" r="3" opacity=".45"/>
    <circle cx="1460" cy="172" r="8" opacity=".16" filter="url(#soft)"/>
    <circle cx="1238" cy="274" r="10" opacity=".12" filter="url(#soft)"/>
    <circle cx="1510" cy="308" r="4" opacity=".30"/>
    <circle cx="1407" cy="370" r="7" opacity=".12" filter="url(#soft)"/>
    <circle cx="1328" cy="410" r="3" opacity=".36"/>
    <circle cx="1540" cy="440" r="11" opacity=".10" filter="url(#soft)"/>
  </g>

  <!-- bottle shadow -->
  <ellipse cx="1260" cy="806" rx="305" ry="44" fill="#000" opacity=".78" filter="url(#soft)"/>

  <!-- left champagne bottle -->
  <g transform="translate(1070 120)">
    <path d="M93 24h60l-3 82c0 28 5 48 16 70 18 36 31 70 31 124v347c0 27-19 48-46 48H95c-27 0-46-21-46-48V300c0-54 13-88 31-124 11-22 16-42 16-70z" fill="url(#bottle)" stroke="#6c5a34" stroke-opacity=".55" stroke-width="2"/>
    <path d="M94 20h58l-2 88H96z" fill="url(#gold)"/>
    <path d="M104 20h38v88h-38z" fill="#f2d17f" opacity=".12"/>
    <rect x="84" y="322" width="77" height="145" rx="5" fill="#d9c79e" opacity=".94"/>
    <rect x="89" y="327" width="67" height="135" rx="3" fill="#10100e"/>
    <path d="M100 349h45M100 431h45" stroke="#c8a45a" stroke-width="1" opacity=".8"/>
    <text x="122.5" y="384" text-anchor="middle" fill="#e5c36d" font-family="Georgia,serif" font-size="15" letter-spacing="3">VALEUR</text>
    <text x="122.5" y="405" text-anchor="middle" fill="#bfb39c" font-family="Arial,sans-serif" font-size="7" letter-spacing="2">SELECTION</text>
    <path d="M105 140c-12 56-17 140-17 255v230" fill="none" stroke="#fff" stroke-opacity=".11" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- right champagne bottle -->
  <g transform="translate(1325 230) scale(.78)">
    <path d="M93 24h60l-3 82c0 28 5 48 16 70 18 36 31 70 31 124v347c0 27-19 48-46 48H95c-27 0-46-21-46-48V300c0-54 13-88 31-124 11-22 16-42 16-70z" fill="url(#bottle)" stroke="#6c5a34" stroke-opacity=".48" stroke-width="2"/>
    <path d="M94 20h58l-2 88H96z" fill="#b88d43"/>
    <rect x="84" y="328" width="77" height="138" rx="5" fill="#e8ddc2" opacity=".94"/>
    <text x="122.5" y="385" text-anchor="middle" fill="#292118" font-family="Georgia,serif" font-size="12" letter-spacing="2">CUVÉE</text>
    <path d="M105 140c-11 54-17 135-17 245v220" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- champagne flute -->
  <g transform="translate(930 410)">
    <path d="M0 0h95c-3 125-16 178-47.5 178S3 125 0 0z" fill="url(#glass)" stroke="#efe4c8" stroke-opacity=".34" stroke-width="2"/>
    <path d="M8 54h79c-5 76-16 107-39.5 107S13 130 8 54z" fill="#d9aa4e" opacity=".36"/>
    <path d="M47.5 178v178M10 356h75" stroke="#efe4c8" stroke-opacity=".34" stroke-width="2"/>
    <circle cx="37" cy="128" r="3" fill="#f5dd9b" opacity=".55"/><circle cx="56" cy="108" r="2" fill="#f5dd9b" opacity=".55"/><circle cx="45" cy="82" r="2.4" fill="#f5dd9b" opacity=".55"/>
  </g>

  <!-- elegant gold line detail -->
  <path d="M1000 742c110 32 295 42 510-11" fill="none" stroke="#c89a44" stroke-opacity=".30" stroke-width="1.2"/>
  <path d="M1035 765c128 25 305 28 473-12" fill="none" stroke="#f2dc9e" stroke-opacity=".12"/>

  <!-- vignette and texture -->
  <rect width="1600" height="900" fill="#000" opacity=".14" filter="url(#grain)"/>
  <rect width="1600" height="900" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="80"/>
</svg>